services:

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      LOCAL_UPLOAD_DIR: /app/local_uploads
      # El entorno Docker local conserva archivos en el volumen local_uploads.
      # R2 sigue teniendo prioridad cuando sus credenciales son válidas.
      LOCAL_STORAGE_FALLBACK: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - local_uploads:/app/local_uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
       context: ./frontend
       args:
         - VITE_API_URL=${FRONTEND_API_URL:-/api}
         - VITE_API_PORT=${VITE_API_PORT:-3000}
         - VITE_WHATSAPP_PHONE=${VITE_WHATSAPP_PHONE:-}

    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  local_uploads:
  db_data:
